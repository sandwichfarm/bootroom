[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Custom pre-publish smoke job (06-06): runs the release-smoke reusable
# workflow during the host phase. cargo-dist will inject a `needs:`
# reference into the generated release.yml so the `host` job (which
# performs `gh release create`) only proceeds when the smoke is green.
# The referenced file is `.github/workflows/release-smoke.yml`; cargo-dist
# resolves the `./release-smoke` prefix relative to `.github/workflows/`.
host-jobs = ["./release-smoke"]
