[package]
name = "bootroom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure types and protocol definitions for bootroom (no I/O)."
homepage = "https://github.com/sandwich-farm/bootroom"
documentation = "https://docs.rs/bootroom-core"
readme = "README.md"
keywords = ["bootroom", "qemu", "wasm", "riscv", "protocol"]
categories = ["development-tools::testing", "wasm", "data-structures"]
publish = true
include = [
    "src/**/*.rs",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
]

[dependencies]
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
