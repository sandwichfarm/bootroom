[package]
name = "bootroom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Web-based test harness for RISC-V kernels via qemu-wasm."
build = "build.rs"

[lib]
name = "bootroom"
path = "src/lib.rs"

[[bin]]
name = "bootroom"
path = "src/main.rs"

[dependencies]
bootroom-core.workspace = true
anyhow.workspace = true
clap.workspace = true
axum = { workspace = true, features = ["ws"] }
# Phase 3: base64 re-enabled — the watcher (plan 03-06) needs to encode
# decoded action bytes into the /api/config JSON projection so the browser
# can dispatch byte-perfect SerialIn frames without re-running escape
# decoding (RESEARCH Pattern 5: server is single source of truth).
base64.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
futures-util.workspace = true
open.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-util.workspace = true
include_dir.workspace = true
mime_guess.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = { workspace = true }
tempfile = "3.10"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
